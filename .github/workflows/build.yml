name: Build Arcane Arsenal

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bedrock packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bp_root = Path("behavior_pack")
          rp_root = Path("resource_pack")
          bp = json.loads((bp_root / "manifest.json").read_text())
          rp = json.loads((rp_root / "manifest.json").read_text())

          assert bp["header"]["uuid"] != rp["header"]["uuid"]
          assert any(m.get("type") == "script" for m in bp["modules"])
          assert any(m.get("type") == "resources" for m in rp["modules"])
          assert any(d.get("module_name") == "@minecraft/server" for d in bp.get("dependencies", []))

          json_files = list(bp_root.rglob("*.json")) + list(rp_root.rglob("*.json"))
          documents = {p: json.loads(p.read_text()) for p in json_files}

          item_atlas = documents[rp_root / "textures/item_texture.json"]["texture_data"]
          terrain_atlas = documents[rp_root / "textures/terrain_texture.json"]["texture_data"]

          for path in (bp_root / "items").glob("*.json"):
              item = documents[path]["minecraft:item"]
              identifier = item["description"]["identifier"].split(":", 1)[1]
              icon = item["components"]["minecraft:icon"]["textures"]["default"]
              assert icon in item_atlas, f"{path}: missing item atlas entry {icon}"
              texture_path = rp_root / "textures" / item_atlas[icon]["textures"]
              assert texture_path.with_suffix(".png").is_file(), f"{path}: missing texture {texture_path}.png"

          for path in (bp_root / "blocks").glob("*.json"):
              block = documents[path]["minecraft:block"]
              identifier = block["description"]["identifier"].split(":", 1)[1]
              material = block["components"]["minecraft:material_instances"]["*"]["texture"]
              assert material in terrain_atlas, f"{path}: missing terrain atlas entry {material}"
              texture_path = rp_root / "textures" / terrain_atlas[material]["textures"]
              assert texture_path.with_suffix(".png").is_file(), f"{path}: missing texture {texture_path}.png"

          feature_ids = set()
          for path in (bp_root / "features").glob("*.json"):
              data = documents[path]
              for component in data.values():
                  if isinstance(component, dict) and "description" in component:
                      feature_ids.add(component["description"]["identifier"])

          for path in (bp_root / "feature_rules").glob("*.json"):
              rule = documents[path]["minecraft:feature_rules"]["description"]
              assert rule["places_feature"] in feature_ids, f"{path}: unknown feature {rule['places_feature']}"

          for path in (bp_root / "entities").glob("*.json"):
              entity = documents[path]["minecraft:entity"]["description"]["identifier"]
              client_path = rp_root / "entity" / (path.stem + ".entity.json")
              assert client_path.is_file(), f"{path}: missing client entity"
              client = json.loads(client_path.read_text())
              assert client["minecraft:client_entity"]["description"]["identifier"] == entity

          print(f"Validated {len(json_files)} Bedrock JSON files and all item, block, feature, and entity references.")
          PY

      - name: Check JavaScript syntax
        run: node --input-type=module --check < behavior_pack/scripts/main.js

      - name: Generate textures
        run: python tools/generate_textures.py

      - name: Build and verify Minecraft packages
        run: |
          set -euo pipefail
          rm -rf dist package
          mkdir -p dist package/ArcaneArsenal_BP package/ArcaneArsenal_RP

          cp -a behavior_pack/. package/ArcaneArsenal_BP/
          cp -a resource_pack/. package/ArcaneArsenal_RP/

          (cd behavior_pack && zip -qr ../dist/ArcaneArsenal_BP.mcpack .)
          (cd resource_pack && zip -qr ../dist/ArcaneArsenal_RP.mcpack .)
          (cd package && zip -qr ../dist/ArcaneArsenal.mcaddon ArcaneArsenal_BP ArcaneArsenal_RP)

          python - <<'PY'
          from zipfile import ZipFile

          checks = {
              "dist/ArcaneArsenal_BP.mcpack": "manifest.json",
              "dist/ArcaneArsenal_RP.mcpack": "manifest.json",
          }
          for archive, required in checks.items():
              with ZipFile(archive) as z:
                  assert required in z.namelist(), f"{archive}: missing root {required}"
                  bad = z.testzip()
                  assert bad is None, f"{archive}: corrupt member {bad}"

          with ZipFile("dist/ArcaneArsenal.mcaddon") as z:
              names = set(z.namelist())
              assert "ArcaneArsenal_BP/manifest.json" in names
              assert "ArcaneArsenal_RP/manifest.json" in names
              bad = z.testzip()
              assert bad is None, f"mcaddon: corrupt member {bad}"

          print("All three Minecraft packages passed archive-structure checks.")
          PY

      - name: Upload behavior pack
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneArsenal-BP-mcpack
          path: dist/ArcaneArsenal_BP.mcpack
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneArsenal-RP-mcpack
          path: dist/ArcaneArsenal_RP.mcpack
          if-no-files-found: error

      - name: Upload combined addon
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneArsenal-mcaddon
          path: dist/ArcaneArsenal.mcaddon
          if-no-files-found: error

      - name: Publish direct-download release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ArcaneArsenal_BP.mcpack
            dist/ArcaneArsenal_RP.mcpack
            dist/ArcaneArsenal.mcaddon

  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Fabric mod
        working-directory: java-fabric
        run: gradle build
      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneArsenal-Fabric-JAR
          path: java-fabric/build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
